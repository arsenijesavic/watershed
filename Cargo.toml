[package]
name = "watershed"
version = "0.1.0"
edition = "2021"
description = "An ecological financial projection engine for creative practitioners."
license = "MIT OR Apache-2.0"
keywords = ["finance", "simulation", "projection", "creative", "watershed"]
categories = ["algorithms", "science"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[[example]]
name = "simulate"
path = "examples/simulate.rs"
